<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="درة تريم - لا توجد صورة">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf7fc"/>
      <stop offset="100%" stop-color="#f2eaf7"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6b4c8c" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a974c4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6b4c8c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Warm luxury lilac canvas -->
  <rect width="600" height="600" fill="#f7f3fa"/>
  <rect width="600" height="600" fill="url(#bg)"/>

  <!-- Subtle architectural border frame -->
  <rect x="28" y="28" width="544" height="544" rx="28" fill="none" stroke="#6b4c8c" stroke-opacity="0.14" stroke-width="1.5"/>
  <rect x="40" y="40" width="520" height="520" rx="22" fill="none" stroke="#a974c4" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="6 8"/>

  <!-- Soft decorative corner glows -->
  <circle cx="95" cy="95" r="70" fill="#a974c4" fill-opacity="0.08"/>
  <circle cx="505" cy="505" r="85" fill="#6b4c8c" fill-opacity="0.07"/>

  <!-- Centered emblem safe zone (works cleanly on 1:1, 3:4, and 4:3 crops) -->
  <g transform="translate(300 245)">
    <!-- Soft medallion backing -->
    <circle cx="0" cy="0" r="78" fill="#ffffff" fill-opacity="0.88" stroke="#6b4c8c" stroke-opacity="0.16" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="66" fill="none" stroke="#a974c4" stroke-opacity="0.28" stroke-width="1"/>

    <!-- Minimalist boutique hanger & flowing fabric emblem -->
    <path d="M 0 -42 C 0 -51 12 -52 12 -43 C 12 -36 0 -33 0 -24" fill="none" stroke="#a974c4" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 0 -24 L -40 4 C -45 8 -42 15 -35 15 L 35 15 C 42 15 45 8 40 4 Z" fill="none" stroke="#6b4c8c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -26 15 C -24 27 -16 34 0 36 C 16 34 24 27 26 15" fill="none" stroke="#6b4c8c" stroke-opacity="0.45" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M -14 15 C -11 23 -5 27 0 28 C 5 27 11 23 14 15" fill="none" stroke="#a974c4" stroke-opacity="0.7" stroke-width="1.8" stroke-linecap="round"/>
    <polygon points="0,-10 5,-4 0,2 -5,-4" fill="#a974c4" fill-opacity="0.9"/>
  </g>

  <!-- Brand & caption -->
  <rect x="200" y="346" width="200" height="2" rx="1" fill="url(#accent-line)"/>

  <text
    x="300"
    y="392"
    text-anchor="middle"
    direction="rtl"
    font-family="Tajawal, Cairo, system-ui, -apple-system, sans-serif"
    font-size="30"
    font-weight="800"
    fill="#6b4c8c"
  >درة تريم</text>

  <text
    x="300"
    y="428"
    text-anchor="middle"
    direction="rtl"
    font-family="Tajawal, Cairo, system-ui, -apple-system, sans-serif"
    font-size="18"
    font-weight="600"
    fill="#1f1629"
    fill-opacity="0.55"
  >لا توجد صورة</text>
</svg>
