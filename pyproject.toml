[project]
name = "durrat-tarim-django"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asgiref==3.11.1",
    "django==6.0.6",
    "python-dotenv==1.2.2",
    "psycopg[binary]==3.3.4",
    "sqlparse==0.5.5",
    "tzdata==2026.2",
    "whitenoise[brotli]>=6.8.2",
    "django-allauth>=65.0,<66",
    "Pillow>=11.0",
    "django-storages[s3]>=1.14.6",
    "requests>=2.34.2",
    "pyjwt[crypto]>=2.8",
    "cryptography>=43.0",
]

[project.optional-dependencies]
container = [
    "gunicorn>=23.0",
    "redis>=5.2",
]

[dependency-groups]
dev = [
    "coverage>=7.17.5",
    "ruff>=0.17.6",
]

[tool.ruff]
extend-exclude = ["*/migrations/*", "staticfiles"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E501"]
