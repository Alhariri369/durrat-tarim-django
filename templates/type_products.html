{% extends "base.html" %} {% block content %}
<section class="mx-auto max-w-7xl px-4 py-12 md:py-16">
    <!-- Header -->
    <div
        class="mb-10 flex flex-wrap items-end justify-between gap-4 border-b border-secondary/5 pb-6 reveal"
    >
        <div>
            <span
                class="mb-2 inline-block rounded-full bg-accent/10 px-3 py-1 text-xs font-bold tracking-wide text-accent"
            >
                {{ category.name_ar }}
            </span>
            <h1 class="text-3xl font-black text-primary md:text-4xl">
                {{ category.name_ar }}
            </h1>
            <p class="mt-2 text-secondary/50">
                جميع المنتجات المتاحة في هذا التصنيف
            </p>
        </div>
        <a
            href="{% url 'product-types' %}"
            class="inline-flex items-center gap-2 rounded-2xl border-2 border-secondary/10 px-5 py-2.5 text-sm font-bold text-secondary transition-all hover:border-accent/30 hover:text-accent"
        >
            <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-4 w-4"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M15 19l-7-7 7-7"
                />
            </svg>
            جميع التصنيفات
        </a>
    </div>

    <!-- Products Grid -->
    <div>{% include "catalog/partials/product_grid.html" %}</div>

    <!-- Pagination -->
    <div>{% include "catalog/partials/pagination.html" %}</div>
</section>
{% endblock %}
