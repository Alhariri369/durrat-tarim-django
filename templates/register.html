{% extends "base.html" %} {% block content %}
<div class="min-h-screen flex items-center justify-center bg-background">
    <div class="w-full max-w-md p-8 bg-surface rounded-xl shadow-md">
        <h2 class="text-2xl font-bold mb-6 text-center text-primary">
            إنشاء حساب جديد
        </h2>

        {% if messages %} {% for message in messages %}
        <p
            class="p-3 rounded-lg text-center mb-4 {% if message.tags == 'success' %}bg-green-50 text-green-700{% elif message.tags == 'error' %}bg-red-50 text-red-700{% else %}bg-blue-50 text-blue-700{% endif %}"
        >
            {{ message }}
        </p>
        {% endfor %} {% endif %} {% if error %}
        <p class="text-red-500 text-center mb-4">{{ error }}</p>
        {% endif %}

        <form
            method="post"
            action="{% url 'account_signup' %}"
            class="flex flex-col gap-4"
        >
            {% csrf_token %}
            <div>
                <label
                    for="full_name"
                    class="block text-sm font-medium text-secondary"
                    >الاسم الكامل</label
                >
                <input
                    type="text"
                    name="full_name"
                    id="full_name"
                    required
                    autocomplete="name"
                    value="{{ full_name|default:'' }}"
                    class="mt-1 block w-full border border-secondary/30 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-primary"
                />
            </div>

            <div>
                <label
                    for="email"
                    class="block text-sm font-medium text-secondary"
                    >البريد الإلكتروني</label
                >
                <input
                    type="email"
                    name="email"
                    id="email"
                    required
                    autocomplete="email"
                    value="{{ email|default:'' }}"
                    class="mt-1 block w-full border border-secondary/30 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-primary"
                />
            </div>

            <div>
                <label
                    for="password1"
                    class="block text-sm font-medium text-secondary"
                    >كلمة المرور</label
                >
                <input
                    type="password"
                    name="password1"
                    id="password1"
                    required
                    autocomplete="new-password"
                    class="mt-1 block w-full border border-secondary/30 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-primary"
                />
            </div>

            <div>
                <label
                    for="password2"
                    class="block text-sm font-medium text-secondary"
                    >تأكيد كلمة المرور</label
                >
                <input
                    type="password"
                    name="password2"
                    id="password2"
                    required
                    autocomplete="new-password"
                    class="mt-1 block w-full border border-secondary/30 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-primary"
                />
            </div>

            <button
                type="submit"
                class="w-full bg-primary text-background font-bold py-2 rounded-full hover:opacity-90 transition-all"
            >
                إنشاء حساب
            </button>
        </form>

        <p class="mt-4 text-center text-sm text-secondary">
            لديك حساب بالفعل؟
            <a
                href="{% url 'account_login' %}"
                class="text-primary font-semibold hover:underline"
                >تسجيل الدخول</a
            >
        </p>
    </div>
</div>
{% endblock %}
