{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-background">
    <div class="w-full max-w-md p-8 bg-surface rounded-xl shadow-md">
        <h2 class="text-2xl font-bold mb-6 text-center text-primary">إنشاء حساب جديد</h2>

        {% if error %}
            <p class="text-red-500 text-center mb-4">{{ error }}</p>
        {% endif %}

        <form method="post" action="/auth/register" class="flex flex-col gap-4">
            {% csrf_token %}
            <div>
                <label for="username" class="block text-sm font-medium text-secondary">اسم المستخدم</label>
                <input type="text" name="username" id="username" required
                    class="mt-1 block w-full border border-secondary/30 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-primary">
            </div>

            <div>
                <label for="full_name" class="block text-sm font-medium text-secondary">الاسم الكامل (اختياري)</label>
                <input type="text" name="full_name" id="full_name"
                    class="mt-1 block w-full border border-secondary/30 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-primary">
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-secondary">البريد الإلكتروني</label>
                <input type="email" name="email" id="email" required
                    class="mt-1 block w-full border border-secondary/30 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-primary">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-secondary">كلمة المرور</label>
                <input type="password" name="password" id="password" required
                    class="mt-1 block w-full border border-secondary/30 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-primary">
            </div>

            <button type="submit"
                class="w-full bg-primary text-background font-bold py-2 rounded-full hover:opacity-90 transition-all">
                إنشاء حساب
            </button>
        </form>

        <p class="mt-4 text-center text-sm text-secondary">
            لديك حساب بالفعل؟
            <a href="/auth/login" class="text-primary font-semibold hover:underline">تسجيل الدخول</a>
        </p>
    </div>
</div>
{% endblock %}
