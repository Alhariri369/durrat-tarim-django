{% load static %}
<title>{{ page_title|default:"درة تريم للأقمشة" }}</title>
<meta
    name="description"
    content="{{ meta_description|default:'تصفحي أحدث الأزياء' }}"
/>

<!-- Canonical URL (scheme + host + path, query string stripped) -->
<link
    rel="canonical"
    href="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}"
/>

<!-- Open Graph (WhatsApp / Facebook / Messenger link previews) -->
<meta property="og:type" content="{{ og_type|default:'website' }}" />
<meta
    property="og:url"
    content="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}"
/>
<meta property="og:site_name" content="درة تريم" />
<meta property="og:locale" content="ar_AR" />
<meta
    property="og:title"
    content="{{ page_title|default:'درة تريم للأقمشة' }}"
/>
<meta
    property="og:description"
    content="{{ meta_description|default:'تصفحي أحدث الأزياء.' }}"
/>
<meta
    property="og:image"
    content="{% if og_image %}{{ og_image }}{% else %}{{ request.scheme }}://{{ request.get_host }}{% static 'images/logo-gold-transparent.png' %}{% endif %}"
/>

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image" />
<meta
    name="twitter:title"
    content="{{ page_title|default:'درة تريم للأقمشة' }}"
/>
<meta
    name="twitter:description"
    content="{{ meta_description|default:'تصفحي أحدث الأزياء.' }}"
/>
<meta
    name="twitter:image"
    content="{% if og_image %}{{ og_image }}{% else %}{{ request.scheme }}://{{ request.get_host }}{% static 'images/logo-gold-transparent.png' %}{% endif %}"
/>

<!-- Google Search Console verification -->
<meta
    name="google-site-verification"
    content="Nw2fa1L4QIRwROBucFvq9n1e796Zsbk0XyTbAPx4nyw"
/>

<!-- Organization structured data (site-wide) -->
<script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "درة تريم",
        "url": "{{ request.scheme }}://{{ request.get_host }}",
        "logo": "{{ request.scheme }}://{{ request.get_host }}{% static 'images/logo-gold-transparent.png' %}",
        "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "+{{ site_settings.whatsapp_number|default:'967783278181' }}",
            "contactType": "customer service",
            "areaServed": "YE"
        },
        "sameAs": [
            "https://www.instagram.com/durttrim/",
            "https://www.snapchat.com/add/durttrim",
            "https://www.tiktok.com/@durttrim"
        ]
    }
</script>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#f6f1ee" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@300;400;500;700;800;900&family=El+Messiri:wght@400;500;600;700&display=swap"
    rel="stylesheet"
/>

<link rel="stylesheet" href="{% static 'css/animations.css' %}" />
<link rel="stylesheet" href="{% static 'css/output.css' %}" />

{% if site_settings %}
<style>
    :root {
        --color-primary: {{ site_settings.light_color_primary|default:"#30669c" }};
        --color-secondary: {{ site_settings.light_color_secondary|default:"#08121b" }};
        --color-accent: {{ site_settings.light_color_accent|default:"#e0801f" }};
        --color-background: {{ site_settings.light_color_background|default:"#f6f1ee" }};
        --color-surface: {{ site_settings.light_color_surface|default:"#ffffff" }};
    }

    html.dark {
        --color-primary: {{ site_settings.dark_color_primary|default:"#39f2f9" }};
        --color-secondary: {{ site_settings.dark_color_secondary|default:"#e0ebe7" }};
        --color-accent: {{ site_settings.dark_color_accent|default:"#e7994b" }};
        --color-background: {{ site_settings.dark_color_background|default:"#08121b" }};
        --color-surface: {{ site_settings.dark_color_surface|default:"#0c1927" }};
    }

    body {
        background-color: var(--color-background);
        color: var(--color-secondary);
    }
</style>
{% endif %}
