{% load static %}
<title>
    {{ page_title|default:"درة تريم للأقمشة" }}
    {% if product %} - {{ product.name_ar }}{% endif %}
    {% if category %} - {{ category.name_ar }}{% endif %}
    - درة تريم
</title>
<meta
    name="description"
    content="{{ meta_description|default:'تصفحي أحدث الأزياء'|truncatechars:160 }}"
/>

<!-- Canonical URL (scheme + host + path, query string stripped, pagination: page=1 canonical) -->
<link
    rel="canonical"
    href="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}{% if request.GET %}?page=1{% endif %}"
/>

<!-- Open Graph (WhatsApp / Facebook / Messenger link previews) -->
<meta property="og:type" content="{{ og_type|default:'website' }}" />
<meta
    property="og:url"
    content="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}"
/>
<meta property="og:site_name" content="درة تريم" />
<meta property="og:locale" content="ar_AR" />
<meta
    property="og:title"
    content="{{ page_title|default:'درة تريم للأقمشة' }}"
/>
<meta
    property="og:description"
    content="{{ meta_description|default:'تصفحي أحدث الأزياء.'|truncatechars:160 }}"
/>
<meta
    property="og:image"
    content="{% if og_image %}{{ og_image }}{% else %}{{ request.scheme }}://{{ request.get_host }}{% static 'images/logo-gold-transparent.png' %}{% endif %}"
/>

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image" />
<meta
    name="twitter:title"
    content="{{ page_title|default:'درة تريم للأقمشة' }}"
/>
<meta
    name="twitter:description"
    content="{{ meta_description|default:'تصفحي أحدث الأزياء.'|truncatechars:160 }}"
/>
<meta
    name="twitter:image"
    content="{% if og_image %}{{ og_image }}{% else %}{{ request.scheme }}://{{ request.get_host }}{% static 'images/logo-gold-transparent.png' %}{% endif %}"
/>

<!-- Google Search Console verification -->
<meta
    name="google-site-verification"
    content="Nw2fa1L4QIRwROBucFvq9n1e796Zsbk0XyTbAPx4nyw"
/>

<!-- Organization structured data (site-wide) -->
<script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "درة تريم",
        "url": "{{ request.scheme }}://{{ request.get_host }}",
        "logo": "{{ request.scheme }}://{{ request.get_host }}{% static 'images/logo-gold-transparent.png' %}",
        "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "+{{ site_settings.whatsapp_number|default:'967783278181' }}",
            "contactType": "customer service",
            "areaServed": "YE"
        },
        "sameAs": [
            "https://www.instagram.com/durttrim/",
            "https://www.snapchat.com/add/durttrim",
            "https://www.tiktok.com/@durttrim"
        ]
    }
</script>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<meta name="theme-color" content="#f6f1ee" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#08121b" media="(prefers-color-scheme: dark)" />

<!-- TODO(theme): replace with dynamic token after B3/B4 -->

<!-- Robots meta -->
<meta name="robots" content="index,follow" />

<!-- Noindex for search results and auth pages -->
<!-- <meta name="robots" content="noindex"> conditional logic would be added in views -->

<!-- Hreflang placeholder for future multi-language support -->
<!-- <link rel="alternate" hreflang="en" href="..." /> -->

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@300;400;500;700;800;900&family=El+Messiri:wght@400;500;600;700&display=swap"
    rel="stylesheet"
/>

<link rel="stylesheet" href="{% static 'css/animations.css' %}" />
<link rel="stylesheet" href="{% static 'css/output.css' %}" />

{% include 'partials/theme-variables.html' %}
