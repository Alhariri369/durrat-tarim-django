{% load static catalog_tags %}
<title>{{ page_title|default:"درة تريم | قطع عرائسية وأقمشة وأزياء راقية" }}</title>
<meta
    name="description"
    content="{{ meta_description|default:'درة تريم — وجهتكِ الأولى للقطع العرائسية والأقمشة الفاخرة والأزياء الراقية في تريم وسيئون ووادي حضرموت واليمن.'|truncatechars:160 }}"
/>

<!-- Canonical URL -->
<link rel="canonical" href="{{ canonical_url }}" />

<!-- Open Graph (WhatsApp / Facebook / Messenger link previews) -->
<meta property="og:type" content="{{ og_type|default:'website' }}" />
<meta property="og:url" content="{{ canonical_url }}" />
<meta property="og:site_name" content="درة تريم" />
<meta property="og:locale" content="ar_AR" />
<meta
    property="og:title"
    content="{{ page_title|default:'درة تريم | قطع عرائسية وأقمشة وأزياء راقية' }}"
/>
<meta
    property="og:description"
    content="{{ meta_description|default:'درة تريم — وجهتكِ الأولى للقطع العرائسية والأقمشة الفاخرة والأزياء الراقية في تريم وسيئون ووادي حضرموت واليمن.'|truncatechars:160 }}"
/>
<meta
    property="og:image"
    content="{{ og_image|default:default_og_image_url }}"
/>

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image" />
<meta
    name="twitter:title"
    content="{{ page_title|default:'درة تريم | قطع عرائسية وأقمشة وأزياء راقية' }}"
/>
<meta
    name="twitter:description"
    content="{{ meta_description|default:'درة تريم — وجهتكِ الأولى للقطع العرائسية والأقمشة الفاخرة والأزياء الراقية في تريم وسيئون ووادي حضرموت واليمن.'|truncatechars:160 }}"
/>
<meta
    name="twitter:image"
    content="{{ og_image|default:default_og_image_url }}"
/>

{% if google_site_verification %}
<!-- Google Search Console verification -->
<meta
    name="google-site-verification"
    content="{{ google_site_verification }}"
/>
{% endif %}

{% store_json_ld %}

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/png" sizes="64x64" href="{% static 'images/favicon.png' %}" />
<link rel="apple-touch-icon" sizes="180x180" href="{% static 'images/apple-touch-icon.png' %}" />

<meta name="theme-color" content="{{ site_settings.light_color_background|default:'#f7f3fa' }}" />

<!-- Robots meta -->
<meta name="robots" content="{% if seo_noindex_host %}noindex,nofollow{% else %}{{ robots_content|default:'index,follow' }}{% endif %}" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
    href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=Tajawal:wght@400;500;700;800&display=swap"
    rel="stylesheet"
/>

<link rel="stylesheet" href="{% static 'css/animations.css' %}" />
<link rel="stylesheet" href="{% static 'css/output.css' %}" />

{% include 'partials/theme-variables.html' %}
