{% extends "base.html" %}
{% block content %}
<section class="mx-auto flex min-h-[70vh] max-w-2xl items-center justify-center px-4 py-16 sm:px-6 lg:px-8">
    <div class="atelier-card w-full p-8 text-center sm:p-12">
        <span
            class="mx-auto mb-5 flex h-14 w-14 items-center justify-center rounded-xl border border-secondary/10 bg-background text-primary"
            aria-hidden="true"
        >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        </span>
        <p class="mb-2 text-xs font-bold tracking-wide text-primary tabular-nums">404</p>
        <h1 class="font-display text-2xl font-bold text-secondary sm:text-3xl">
            عذراً، هذه الصفحة غير موجودة
        </h1>
        <p class="mx-auto mt-3 max-w-md text-sm leading-relaxed text-secondary/70">
            ربما تم نقل الرابط أو حذفه. يمكنكِ العودة إلى الصفحة الرئيسية أو تصفح جميع المنتجات المتاحة.
        </p>
        <div class="mt-7 flex flex-wrap items-center justify-center gap-3">
            <a
                href="{% url 'home' %}"
                class="inline-flex min-h-11 items-center justify-center rounded-xl bg-primary px-6 py-2.5 text-sm font-bold text-surface transition-colors hover:bg-primary/90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2"
            >
                العودة للرئيسية
            </a>
            <a
                href="{% url 'product-list' %}"
                class="inline-flex min-h-11 items-center justify-center rounded-xl border border-secondary/18 bg-surface px-6 py-2.5 text-sm font-bold text-secondary transition-colors hover:border-primary/40 hover:text-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2"
            >
                جميع المنتجات
            </a>
        </div>
    </div>
</section>
{% endblock %}
