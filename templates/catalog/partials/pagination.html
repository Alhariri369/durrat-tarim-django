{% if page_obj.paginator.num_pages > 1 %}
<nav
    aria-label="صفحات المنتجات"
    class="mt-12 flex items-center justify-center gap-3 reveal"
    dir="ltr"
>
    {% if page_obj.has_previous %}
    <a
        href="?{% if pagination_query %}{{ pagination_query }}&{% endif %}page={{ page_obj.previous_page_number }}"
        class="inline-flex items-center gap-2 rounded-2xl border-2 border-secondary/10 px-5 py-2.5 text-sm font-bold text-secondary transition-all hover:border-accent/30 hover:text-accent"
        rel="prev"
    >
        <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-4 w-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
        >
            <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15 19l-7-7 7-7"
            />
        </svg>
        السابق
    </a>
    {% endif %}

    <span
        class="rounded-2xl bg-accent/5 px-5 py-2.5 text-sm font-bold text-accent"
        aria-live="polite"
    >
        صفحة {{ page_obj.number }} من {{ page_obj.paginator.num_pages }}
    </span>

    {% if page_obj.has_next %}
    <a
        href="?{% if pagination_query %}{{ pagination_query }}&{% endif %}page={{ page_obj.next_page_number }}"
        class="inline-flex items-center gap-2 rounded-2xl border-2 border-secondary/10 px-5 py-2.5 text-sm font-bold text-secondary transition-all hover:border-accent/30 hover:text-accent"
        rel="next"
    >
        التالي
        <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-4 w-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
        >
            <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 5l7 7-7 7"
            />
        </svg>
    </a>
    {% endif %}
</nav>
{% endif %}
