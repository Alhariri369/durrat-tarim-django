{% if page_obj.paginator.num_pages > 1 %}
<nav
    aria-label="صفحات المنتجات"
    class="mt-12 flex flex-wrap items-center justify-center gap-3 reveal"
>
    {% if page_obj.has_previous %}
    <a
        href="?{% if pagination_query %}{{ pagination_query }}&{% endif %}page={{ page_obj.previous_page_number }}"
        class="inline-flex min-h-11 items-center gap-2 rounded-xl border border-secondary/15 bg-surface px-4 py-2.5 text-sm font-bold text-secondary transition-colors hover:border-primary/35 hover:text-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2"
        rel="prev"
    >
        <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-4 w-4 shrink-0"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
        >
            <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 5l7 7-7 7"
            />
        </svg>
        <span>السابق</span>
    </a>
    {% endif %}

    <span
        class="inline-flex min-h-11 items-center rounded-xl border border-secondary/10 bg-surface px-4 py-2.5 text-sm font-bold text-primary tabular-nums"
        aria-live="polite"
    >
        صفحة {{ page_obj.number }} من {{ page_obj.paginator.num_pages }}
    </span>

    {% if page_obj.has_next %}
    <a
        href="?{% if pagination_query %}{{ pagination_query }}&{% endif %}page={{ page_obj.next_page_number }}"
        class="inline-flex min-h-11 items-center gap-2 rounded-xl border border-secondary/15 bg-surface px-4 py-2.5 text-sm font-bold text-secondary transition-colors hover:border-primary/35 hover:text-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2"
        rel="next"
    >
        <span>التالي</span>
        <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-4 w-4 shrink-0"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
        >
            <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15 19l-7-7 7-7"
            />
        </svg>
    </a>
    {% endif %}
</nav>
{% endif %}
