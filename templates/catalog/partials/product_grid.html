<div class="grid grid-cols-2 gap-3.5 sm:gap-5 lg:grid-cols-3 xl:grid-cols-4">
    {% for product in products %}
    <div class="min-w-0 reveal stagger-{{ forloop.counter }}">
        {% include "catalog/partials/product_card.html" %}
    </div>
    {% empty %}
    <div
        class="col-span-full rounded-2xl border border-secondary/12 bg-surface px-6 py-16 text-center reveal"
    >
        <div
            class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-xl border border-secondary/10 bg-background text-primary"
            aria-hidden="true"
        >
            <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-7 w-7"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="1.5"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M12 6a2 2 0 10-2-2c0 1.1.9 2 2 2zm0 0v2m0 0L4.5 14.2A1.5 1.5 0 005.46 17h13.08a1.5 1.5 0 00.96-2.8L12 8z"
                />
            </svg>
        </div>
        <p class="text-lg font-bold text-secondary">
            {{ empty_message|default:"لا توجد منتجات متاحة حالياً." }}
        </p>
        <a
            href="{% url 'product-search' %}"
            class="mt-4 inline-flex min-h-10 items-center gap-1.5 text-sm font-bold text-primary transition-colors hover:text-secondary focus-visible:outline-none focus-visible:underline"
        >
            <span>تصفحي جميع المنتجات</span>
            <span aria-hidden="true">←</span>
        </a>
    </div>
    {% endfor %}
</div>
