{% extends "admin/base.html" %}

{% block content %}
<div class="container mx-auto py-8 px-4 max-w-4xl">
    <div class="flex items-center gap-4 mb-8">
        <a href="/admin/products" class="text-secondary/40 hover:text-primary transition-colors">إدارة المنتجات</a>
        <span class="text-secondary/20">/</span>
        <h1 class="text-3xl font-black text-primary font-tajawal text-right">{{ form_title|default:"إضافة منتج جديد" }}</h1>
    </div>

    <form action="{{ form_action|default:'/admin/products/new' }}" method="POST" enctype="multipart/form-data" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        {% csrf_token %}

        <div class="lg:col-span-1 space-y-6">
            <div class="bg-surface border-2 border-dashed border-accent/20 rounded-[2rem] p-4 text-center group hover:border-accent transition-all">
                <label class="cursor-pointer block">
                    <div id="image-preview-container" class="relative aspect-[3/4] bg-background rounded-2xl overflow-hidden flex items-center justify-center mb-4">
                        <span id="placeholder-icon" class="text-6xl group-hover:scale-110 transition-transform duration-500 {% if product.img_url %}hidden{% endif %}">📸</span>
                        <img id="image-preview" src="{% if product.img_url %}{{ product.img_url }}{% else %}#{% endif %}" alt="معاينة صورة المنتج" class="absolute inset-0 w-full h-full object-cover {% if not product.img_url %}hidden{% endif %}">
                    </div>

                    <span class="inline-block px-4 py-2 bg-accent/10 text-accent font-bold rounded-full text-sm group-hover:bg-accent group-hover:text-white transition-all">
                        {% if product %}تغيير صورة المنتج{% else %}اختر صورة المنتج{% endif %}
                    </span>
                    <input type="file" name="img_file" id="img_file" class="hidden" accept="image/*" onchange="previewImage(this)">
                </label>
                <p class="text-xs text-secondary/40 mt-4 leading-relaxed">
                    يفضل استخدام صور بنسبة طولية<br>للحصول على أفضل مظهر في المتجر.
                </p>
            </div>
        </div>

        <div class="lg:col-span-2 space-y-6 bg-surface p-8 rounded-[2.5rem] border border-secondary/5 shadow-sm">

            <div class="space-y-2">
                <label class="text-sm font-bold text-secondary/70 mr-2">اسم المنتج</label>
                <input type="text" name="name" required placeholder="مثال: فستان سهرة مخمل" value="{{ product.name|default:'' }}"
                    class="w-full px-6 py-4 bg-background border border-secondary/10 rounded-2xl focus:border-accent focus:ring-4 focus:ring-accent/5 outline-none transition-all text-secondary">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="text-sm font-bold text-secondary/70 mr-2">التصنيف</label>
                    <input type="text" name="type" required placeholder="مثال: فساتين" value="{{ product.type|default:'' }}"
                        class="w-full px-6 py-4 bg-background border border-secondary/10 rounded-2xl focus:border-accent focus:ring-4 focus:ring-accent/5 outline-none transition-all text-secondary">
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-bold text-secondary/70 mr-2">السعر (ر.س)</label>
                    <input required type="number" step="0.01" name="price" value="{{ product.price|stringformat:'.2f'|default:'' }}"
                        class="w-full px-6 py-4 bg-background border border-secondary/10 rounded-2xl focus:border-accent focus:ring-4 focus:ring-accent/5 outline-none transition-all text-secondary">
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-sm font-bold text-secondary/70 mr-2">وصف المنتج</label>
                <textarea name="description" rows="4" placeholder="اكتب تفاصيل المنتج، المقاسات، ونوع القماش..." 
                    class="w-full px-6 py-4 bg-background border border-secondary/10 rounded-2xl focus:border-accent focus:ring-4 focus:ring-accent/5 outline-none transition-all text-secondary resize-none">{{ product.description|default:'' }}</textarea>
            </div>

            <div class="flex items-center gap-4 pt-4">
                <button type="submit"
                    class="flex-grow py-5 bg-primary text-background font-black text-xl rounded-2xl shadow-xl shadow-primary/20 hover:opacity-90 active:scale-[0.98] transition-all duration-300">
                    {{ submit_label|default:"حفظ المنتج" }}
                </button>
                <a href="/admin/products" class="px-8 py-5 bg-secondary/5 text-secondary font-bold rounded-2xl hover:bg-secondary/10 transition-all">
                    إلغاء
                </a>
            </div>
        </div>

    </form>
</div>

<script>
    function previewImage(input) {
        const preview = document.getElementById('image-preview');
        const placeholder = document.getElementById('placeholder-icon');

        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.classList.remove('hidden');
                placeholder.classList.add('hidden');
            }
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>
{% endblock %}
