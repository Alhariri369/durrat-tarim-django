<div class="flex items-center justify-between p-3 rounded-2xl hover:bg-secondary/10 transition-colors group">
    <label class="font-medium {% if is_dark %}text-gray-100{% else %}text-gray-800{% endif %}">{{ label }}</label>
    <div class="flex items-center gap-3">
        <span class="text-xs font-mono opacity-40 {% if is_dark %}text-gray-300{% else %}text-gray-600{% endif %} uppercase">{{ value }}</span>
        <input type="color" name="{{ name }}" value="{{ value }}"
               class="w-12 h-12 rounded-xl cursor-pointer border-0 bg-transparent transition-transform group-hover:scale-110
                      [&::-webkit-color-swatch-wrapper]:p-0 [&::-webkit-color-swatch]:rounded-xl [&::-webkit-color-swatch]:border-2
                      [&::-webkit-color-swatch]:border-secondary/20">
    </div>
</div>
