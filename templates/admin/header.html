{% block header %}
<nav class="sticky top-0 z-40 w-full border-b border-accent/20 bg-surface/90 backdrop-blur-md py-3">
    <div class="px-4 lg:px-6 flex flex-col md:flex-row items-center justify-between gap-4">
        <div class="flex items-center justify-between w-full md:w-auto">
            <a href="/admin" class="text-xl font-bold text-primary font-tajawal {% if request.path == '/admin/' %}pointer-events-none cursor-default{% endif %}">إدارة درة تريم</a>
            <a href="/admin/logout" class="md:hidden p-2 bg-red-500/10 text-red-500 rounded-lg text-sm">خروج</a>
        </div>

        <div class="flex items-center gap-3 w-full md:w-auto overflow-x-auto pb-2 md:pb-0 no-scrollbar">
            <a href="/admin/" class="flex-1 md:flex-none min-w-25 bg-secondary/5 border border-secondary/10 rounded-xl p-2 px-4 hover:bg-secondary/10 hover:border-accent/40 transition-all {% if request.path == '/admin/' %}bg-secondary/10 border-accent pointer-events-none cursor-default{% endif %}">
                <div class="flex items-center gap-3"><span class="text-lg">🏠</span><span class="text-sm font-bold text-secondary">الرئيسية</span></div>
            </a>
            <a href="/admin/products" class="flex-1 md:flex-none min-w-25 bg-secondary/5 border border-secondary/10 rounded-xl p-2 px-4 hover:bg-secondary/10 hover:border-accent/40 transition-all {% if request.path == '/admin/products' %}bg-secondary/10 border-accent pointer-events-none cursor-default{% endif %}">
                <div class="flex items-center gap-3"><span class="text-lg">👗</span><span class="text-sm font-bold text-secondary">المنتجات</span></div>
            </a>
            <a href="/admin/settings" class="flex-1 md:flex-none min-w-25 bg-secondary/5 border border-secondary/10 rounded-xl p-2 px-4 hover:bg-secondary/10 hover:border-accent/40 transition-all {% if request.path == '/admin/settings' %}bg-secondary/10 border-accent pointer-events-none cursor-default{% endif %}">
                <div class="flex items-center gap-3"><span class="text-lg">🎨</span><span class="text-sm font-bold text-secondary">الألوان</span></div>
            </a>
        </div>

        <div class="hidden md:flex items-center gap-4">
            <button id="theme-toggle" class="p-2 rounded-xl border border-secondary/10 bg-secondary/5 hover:bg-secondary/10 transition-all text-sm" aria-label="تبديل الوضع">🌙</button>
            <div class="h-8 w-px bg-secondary/10 mx-2"></div>
            <a href="/" target="_blank" class="text-xs font-bold text-accent hover:opacity-80">المتجر الرسمي</a>
            <a href="/admin/logout" class="px-4 py-2 bg-red-600 text-white text-sm font-bold rounded-xl hover:bg-red-700 shadow-lg shadow-red-600/20">تسجيل الخروج</a>
        </div>
    </div>
</nav>
{% endblock %}
